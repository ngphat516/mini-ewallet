version: '3.9'

services:
  # ── Frontend ──────────────────────────────
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on: [backend]

  # ── Backend ───────────────────────────────
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - SQLSERVER_URL=mssql+pyodbc://sa:YourStrong@Pass123@sqlserver:1433/ebanking?driver=ODBC+Driver+18+for+SQL+Server
      - MONGODB_URL=mongodb://mongo:27017/ebanking_logs
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=your-super-secret-key-change-this
      - JWT_EXPIRE_MINUTES=15
    depends_on: [sqlserver, mongo, redis]

  # ── SQL Server ────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Pass123
      - MSSQL_PID=Developer
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./db/init/01_schema.sql:/init.sql  # Script tạo bảng chạy lần đầu
    ports: ["1433:1433"]

  # ── MongoDB ───────────────────────────────
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    ports: ["27017:27017"]

  # ── Redis ─────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports: ["6379:6379"]

volumes:
  sqlserver_data:
  mongo_data:
  redis_data: