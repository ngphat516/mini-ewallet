services:
  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      # This runs in the user's browser, where the Docker service name is unavailable.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_started

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      SQLSERVER_HOST: sqlserver
      SQLSERVER_PORT: 1433
      SQLSERVER_DB: ebanking
      SQLSERVER_USER: sa
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in backend/.env}
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB: ebanking_logs
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 15
      JWT_REFRESH_EXPIRE_DAYS: 7
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      sql-init:
        condition: service_completed_successfully
      mongo:
        condition: service_started
      redis:
        condition: service_started

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      SA_PASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in backend/.env}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -d master -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Initializes a fresh database only; existing data is left untouched.
  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SQLCMDPASSWORD: ${SQLSERVER_PASSWORD:?Set SQLSERVER_PASSWORD in backend/.env}
    volumes:
      - ./app/db/init/01_schema.sql:/init/01_schema.sql:ro
      - ./app/db/init/02_add_idempotency.sql:/migrations/02_add_idempotency.sql:ro
      - ./app/db/init/03_auth_sessions.sql:/migrations/03_auth_sessions.sql:ro
      - ./scripts/init-sqlserver.sh:/init/init-sqlserver.sh:ro
    entrypoint: ["/bin/bash", "/init/init-sqlserver.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  sqlserver_data:
  mongo_data:
  redis_data:
